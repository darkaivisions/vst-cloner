# Windows build check: does everything that runs on Linux build and pass its tests on Windows too?
# Three jobs, so that each breakage shows on its own.
name: Windows

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Typecheck and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  host:
    name: Host (vch-host, vch-gui)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: JUCE download cache
        uses: actions/cache@v4
        with:
          path: host/build/_deps/juce-src
          key: juce-${{ runner.os }}-${{ hashFiles('host/CMakeLists.txt') }}
      - run: cmake -S host -B host/build
      - run: cmake --build host/build --config Release --parallel
      # end to end: a clone built with CMake/JUCE, loaded by vch-host and compared with its model
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build a clone and verify it
        env:
          VCH_TEST_BUILD: "1"
        run: node --test --test-name-pattern "built clone" clone/test/clone.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: vch-host-windows
          path: |
            host/build/vch-host_artefacts/Release/*.exe
            host/build/vch-gui_artefacts/Release/*.exe

  app:
    name: Desktop app (Tauri, NSIS installer with runtime)
    needs: host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      # the runtime brings JUCE (downloaded by configuring the host) and the host built in the job before
      - name: JUCE download cache
        uses: actions/cache@v4
        with:
          path: host/build/_deps/juce-src
          key: juce-${{ runner.os }}-${{ hashFiles('host/CMakeLists.txt') }}
      - run: cmake -S host -B host/build
      - uses: actions/download-artifact@v4
        with:
          name: vch-host-windows
          path: host/build
      - run: node scripts/stage-runtime.ts
      - run: npm run tauri --workspace @vst-cloner/desktop -- build --bundles nsis --config src-tauri/tauri.runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: vst-cloner-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
