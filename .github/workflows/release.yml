# Release: the Windows installer (from the Windows workflow, with its tests and end-to-end clone check) and the
# Linux AppImage, built for a tag "v*" and published as a GitHub release – a pre-release for 0.x versions and
# tags with a suffix (v1.0.0-rc1). Started by hand it builds both and publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/windows.yml

  linux:
    name: Linux AppImage
    # an older glibc: the AppImage then runs on more distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages (JUCE host, Tauri, AppImage tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxtst-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxext-dev libgl1-mesa-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: JUCE download cache
        uses: actions/cache@v4
        with:
          path: host/build/_deps/juce-src
          key: juce-${{ runner.os }}-${{ hashFiles('host/CMakeLists.txt') }}
      - run: npm run host:configure
      - run: npm run host:build
      - run: npm run app:appimage
      - uses: actions/upload-artifact@v4
        with:
          name: vst-cloner-linux-appimage
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: vst-cloner-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          prerelease=""
          case "$TAG" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --title "vst-cloner ${TAG#v}" --notes-file .github/release-notes.md --generate-notes $prerelease
